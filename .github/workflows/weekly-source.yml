name: Weekly Scholarship Sourcing
on:
  schedule:
    - cron: '0 2 * * 1'  # 02:00 UTC = 09:00 WIB Senin
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sourcing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/source.py

      - name: Commit if changed
        run: |
          git config user.name "scholarship-bot"
          git config user.email "bot@ummanitarian.org"
          git add data/scholarships.json
          git diff --staged --quiet || git commit -m "chore: scholarships $(date +%Y-%m-%d) [auto, tanpa approval]"
          git push

      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy . --project-name scholarship-ummanitarian --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
